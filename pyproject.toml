[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-coach"
version = "0.1.0"
description = "Deterministic running plans, Garmin workouts, and local MCP coaching"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "garminconnect==0.2.38",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "qrcode>=8,<9",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
stride-coach = "stride_coach.cli:app"
stride-coach-mcp = "stride_coach.mcp:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
