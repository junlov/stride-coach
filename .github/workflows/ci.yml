name: CI
on:
  push:
    branches-ignore: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: stride_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d stride_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-test-password@localhost:5432/stride_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=stride_coach --cov-fail-under=90
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --locked --project .. --python '3.11'
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/schema.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run export:mobile
