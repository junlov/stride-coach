name: Bug report
description: Report a reproducible problem with synthetic or redacted data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never include tokens, passwords, or personal activity data."
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example and relevant redacted logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, server OS, Docker/Python version, phone OS, app build, and deployment method.
    validations:
      required: true
