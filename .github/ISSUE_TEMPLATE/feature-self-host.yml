name: "Feature: J4 - Self-hoster setup"
description: "J4: Self-hoster setup. Choose this form to apply the matching job label."
labels: ["job:J4-self-host"]
body:
  - type: dropdown
    id: job
    attributes:
      label: Which job does this serve?
      description: Choose another job form if this does not match your request.
      options:
        - "J4 - Self-hoster setup"
      default: 0
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Job story and current problem
      description: "When ... I want ... so I can ..."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and alternatives
      description: What would success look like? What can you do today?
    validations:
      required: true
